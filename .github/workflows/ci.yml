# This workflow checks my YMB project on pushes and pull requests.
# It installs Python dependencies and runs the backend tests.
# The supplied tests use mongomock instead of a real MongoDB server.
# It also checks Compose, builds images and checks NGINX configuration.
# GitHub records the commit and results for Ben's audit trail.
# This workflow does not automatically deploy the application.

name: YMB CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest -q tests/

      - name: Validate Compose
        run: docker compose config --quiet

      - name: Build application images
        run: docker compose build

      - name: Check NGINX configuration
        run: docker compose run --rm nginx nginx -t

      - name: Stop containers
        if: always()
        run: docker compose down -v